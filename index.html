<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北冰洋水產訂單查詢系統</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary-color: #0077b6; --arrived-green: #2d8a4e; --pending-gray: #6c757d; --gold-color: #ffd43b; --paid-color: #94a3b8; }
        body { font-family: "Microsoft JhengHei", sans-serif; padding: 15px; max-width: 800px; margin: auto; background-color: #f0f4f8; color: #333; }
        h2 { color: var(--primary-color); text-align: center; margin-bottom: 25px; letter-spacing: 2px; }
        .filter-section { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .group-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .group-btn { flex: 1; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; cursor: pointer; background: white; font-weight: bold; }
        .group-btn.active { border-color: var(--primary-color); background: var(--primary-color); color: white; }
        .search-box { display: flex; gap: 8px; }
        input { flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 10px; outline: none; font-size: 16px; }
        button#searchBtn { padding: 12px 25px; background: var(--primary-color); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .candidate-area { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; padding: 10px; background: #eef6fb; border-radius: 10px; display: none; }
        .candidate-btn { padding: 8px 15px; background: white; border: 1px solid var(--primary-color); color: var(--primary-color); border-radius: 20px; cursor: pointer; font-weight: bold; }
        .result-id-display { font-size: 1.6em; font-weight: 900; color: var(--primary-color); margin: 15px 0; padding: 12px; background: #fff; border-radius: 8px; border-left: 10px solid var(--primary-color); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .section-title { margin: 25px 0 12px 0; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 1.1em; }
        .title-arrived { background-color: #e6f4ea; color: var(--arrived-green); border-left: 6px solid var(--arrived-green); }
        .title-not-arrived { background-color: #f1f3f4; color: var(--pending-gray); border-left: 6px solid var(--pending-gray); }
        .card { background: white; padding: 15px; margin-bottom: 12px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 8px solid transparent; }
        .arrived-card { border-left-color: var(--arrived-green); }
        .not-arrived-card { border-left-color: var(--pending-gray); }
        .status-tag { display: inline-block; padding: 4px 12px; border-radius: 6px; font-size: 0.95em; font-weight: 900; margin-bottom: 10px; }
        .tag-green { background: #2d8a4e; color: white; }
        .tag-gray { background: #6c757d; color: white; }
        .item-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.15em; }
        .price-text { color: #d93025; font-size: 1.1em; }
        .paid-text { color: var(--paid-color); font-weight: bold; }
        .item-info { color: #666; font-size: 1em; margin-top: 6px; }
        .note-text { margin-top: 10px; color: #0077b6; font-size: 0.9em; border-top: 1px dashed #eee; padding-top: 8px; font-style: italic; }
        .summary-box { background: #1a1c1e; color: white; padding: 25px; border-radius: 18px; margin-top: 35px; }
        .summary-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #333; }
        .highlight-gold { color: var(--gold-color); font-size: 1.5em; font-weight: bold; } 
        .normal-white { color: #ffffff; font-size: 1.5em; font-weight: bold; }
        .warning-footer { text-align: center; margin-top: 30px; padding: 15px; background-color: #fff3e0; color: #e67e22; border-radius: 10px; font-size: 0.95em; font-weight: bold; border: 1px solid #ffe0b2; }
        .print-btn { width: 100%; margin: 20px 0; padding: 15px; background-color: #37474f; color: white; border: none; border-radius: 10px; font-size: 1.1em; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .print-btn:active { background-color: #263238; }
        /* 🖼️ 純白底黑字 Noto Sans TC 大字對帳圖生成區 */
        #captureArea { position: absolute; top: 0; left: 0; margin-top: -99999px; width: 500px; background: #ffffff; color: #000000; padding: 30px 25px; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
        .img-item-row { border-bottom: 3px dashed #000000; padding: 20px 0; }
        .img-item-row:last-of-type { border-bottom: 4px solid #000000; }
        #imageOutput { text-align: center; margin-top: 20px; border: 2px dashed #b0bec5; padding: 15px; background: #fff; display: none; border-radius: 12px; }
        #imageOutput img { width: 100%; max-width: 500px; border: 1px solid #000; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<h2>🚢 北冰洋水產訂單查詢</h2>

<div class="filter-section">
    <div class="group-selector">
        <button class="group-btn active" onclick="setGroup('一群', this)">一群</button>
        <button class="group-btn" onclick="setGroup('二群', this)">二群</button>
    </div>
    <div class="search-box">
        <input type="text" id="idInput" placeholder="輸入名字的一個字篩選 (如: 小)">
        <button id="searchBtn" onclick="handleSearchClick()">搜尋</button>
    </div>
    <div id="candidateArea" class="candidate-area"></div>
</div>

<div id="resultArea"></div>

<div id="imageOutput">
    <div style="color:#d32f2f; font-weight:bold; margin-bottom:12px; font-size: 1.05em;">▼ 下方圖片已生成，請長按儲存或分享 ▼</div>
    <div id="imageContainer"></div>
</div>

<div id="captureArea"></div>

<div class="warning-footer">
    ⚠️ 系統偶有出錯的可能，若有問題請直接詢問版面小編
</div>

<script>
    const sheetId = '1ei5nO5UIA5rAbc1ZOCTnoMN45AATJ1AM1PyyYWA1yQk'; 
    const gidArrived = '1759685312'; 
    const gidNotArrived = '892107033'; 
    
    const csvUrlArrived = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gidArrived}`;
    const csvUrlNotArrived = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gidNotArrived}`;

    // 取貨狀態（B 欄）去掉所有空白，避免「已結寄 7-11」「 已取貨」這類多打或少打空格就查不到
    function normalizeStatus(rows) {
        rows.forEach(r => { if (r && typeof r[1] === "string") r[1] = r[1].replace(/\s+/g, ""); });
        return rows;
    }
    let dataArrived = [];
    let dataNotArrived = [];
    let isDataLoaded = false;
    let currentGroup = '一群';

    const PAID_STATUS = ["已結未取", "已結寄黑貓", "已結寄7-11", "已結未到"];

    function parseAmount(val) {
        if (!val) return 0;
        let cleaned = val.toString().replace(/[$,]/g, '');
        return parseFloat(cleaned) || 0;
    }

    function escapeHtml(str) {
        return String(str == null ? '' : str)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function nowTaipeiText() {
        const p = new Date(Date.now() + 8 * 60 * 60 * 1000);
        const z = n => String(n).padStart(2, '0');
        return `${p.getUTCFullYear()}/${z(p.getUTCMonth() + 1)}/${z(p.getUTCDate())} ${z(p.getUTCHours())}:${z(p.getUTCMinutes())}`;
    }

    function hideImageOutput() {
        const o = document.getElementById('imageOutput');
        if (o) o.style.display = 'none';
        const c = document.getElementById('imageContainer');
        if (c) c.innerHTML = '';
    }

    function setGroup(group, btn) {
        hideImageOutput();
        currentGroup = group;
        document.querySelectorAll('.group-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('candidateArea').style.display = 'none';
        document.getElementById('resultArea').innerHTML = '';
    }

    function parseCSVText(text) {
        const lines = text.split(/\r?\n/);
        const result = [];
        for (let i = 0; i < lines.length; i++) {
            const line = lines[i];
            if (!line.trim()) continue;
            const parts = [];
            let current = '';
            let inQuotes = false;
            for (let j = 0; j < line.length; j++) {
                const char = line[j];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    parts.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            parts.push(current.trim());
            result.push(parts);
        }
        return result;
    }

    async function initDataLoader() {
        try {
            document.getElementById('resultArea').innerHTML = '<div style="text-align:center; padding:20px; color:#666;">⏳ 正在即時同步雲端資料庫...</div>';
            const [resArrived, resNotArrived] = await Promise.all([
                fetch(csvUrlArrived).then(r => r.text()),
                fetch(csvUrlNotArrived).then(r => r.text())
            ]);
            dataArrived = normalizeStatus(parseCSVText(resArrived));
            dataNotArrived = normalizeStatus(parseCSVText(resNotArrived));
            isDataLoaded = true;
            document.getElementById('resultArea').innerHTML = '<div style="text-align:center; padding:10px; color:#2d8a4e; font-size:0.9em; font-weight:bold;">✅ 雲端資料同步完畢，請輸入關鍵字查詢</div>';
        } catch (e) { 
            document.getElementById('resultArea').innerHTML = '<div style="text-align:center; padding:20px; color:#d93025; font-weight:bold;">❌ 資料同步失敗，請確認網路或試算表權限！</div>';
        }
    }

    async function handleSearchClick() {
        if (!isDataLoaded) {
            alert('資料仍在同步中，請稍候再試！');
            return;
        }
        
        const query = document.getElementById('idInput').value.trim().toLowerCase();
        if (!query) return alert('請輸入關鍵字！');
        hideImageOutput();

        // 安全防錯篩選規則
        const filterRule = (row, idx) => {
            if (idx === 0 || !row || row.length < 4) return false;
            const status = row[1] || "";
            const group = row[2] || "";
            const socialID = row[3] || "";
            return group === currentGroup && socialID.toLowerCase().includes(query) && status !== "已取貨" && status !== "已釋出";
        };

        const idsArrived = dataArrived.filter(filterRule).map(row => row[3]);
        const idsNotArrived = dataNotArrived.filter(filterRule).map(row => row[3]);
        const matchedIds = [...new Set([...idsArrived, ...idsNotArrived])];

        const candidateArea = document.getElementById('candidateArea');
        if (matchedIds.length === 0) {
            candidateArea.style.display = 'none';
            document.getElementById('resultArea').innerHTML = '<div style="text-align:center; padding:30px; color:#999; background:white; border-radius:12px;">🔍 在目前的群組中找不到您的待領取紀錄。</div>';
        } else if (matchedIds.length === 1) {
            candidateArea.style.display = 'none';
            showFinalResults(matchedIds[0]);
        } else {
            candidateArea.style.display = 'flex';
            candidateArea.innerHTML = matchedIds.map(id => `<button class="candidate-btn" onclick="showFinalResults('${id.replace(/'/g, "\\'")}')">${id}</button>`).join('');
            document.getElementById('resultArea').innerHTML = '<div style="text-align:center; padding:10px; color:#666;">找到多個相符 ID，請點選：</div>';
        }
    }

    function showFinalResults(targetId) {
        document.getElementById('candidateArea').style.display = 'none';
        hideImageOutput();
        
        const arrivedItems = dataArrived.filter(row => row && row.length > 3 && row[2] === currentGroup && row[3] === targetId && row[1] !== "已取貨" && row[1] !== "已釋出");
        const notArrivedItems = dataNotArrived.filter(row => row && row.length > 3 && row[2] === currentGroup && row[3] === targetId && row[1] !== "已取貨" && row[1] !== "已釋出");
        
        const arrivedList = arrivedItems.filter(r => ["未取貨", "已取未付", "已結未取", "已結寄黑貓", "已結寄7-11"].includes(r[1]));
        const notArrivedList = notArrivedItems.filter(r => ["未到貨", "已結未到"].includes(r[1]));

        let html = `<div class="result-id-display">📍 查詢 ID：${targetId}</div>`;

        html += `<div class="section-title title-arrived">📦 已到貨商品</div>`;
        html += arrivedList.length === 0 ? `<div style="text-align:center; padding:20px; color:#999; background:white; border-radius:12px; border:2px dashed #dee2e6;">目前沒有已到貨商品</div>` : arrivedList.map(r => createCard(r, 'arrived')).join('');

        html += `<div class="section-title title-not-arrived">🗓️ 未到貨商品</div>`;
        html += notArrivedList.length === 0 ? `<div style="text-align:center; padding:20px; color:#999; background:white; border-radius:12px; border:2px dashed #dee2e6;">目前沒有未到貨商品</div>` : notArrivedList.map(r => createCard(r, 'not-arrived')).join('');

        const calc = (list) => {
            const billable = list.filter(r => !PAID_STATUS.includes(r[1]));
            return {
                items: list.length,
                qty: list.reduce((s, r) => s + (parseInt(r[6]) || 0), 0),
                total: billable.reduce((s, r) => s + parseAmount(r[7]), 0)
            };
        };

        const aStats = calc(arrivedList);
        const nStats = calc(notArrivedList);

        // 🖼️ 大字對帳圖：列出已到貨商品，已付款的標「已付」且不算進應付總金額
        const F = "font-family:'Noto Sans TC', sans-serif;";
        let imgContent = `
            <div style="font-size:32px; font-weight:bold; border-bottom:4px solid #000000; padding-bottom:10px; ${F}">ID: ${escapeHtml(targetId)}</div>
            <div style="font-size:26px; font-weight:bold; margin:15px 0 5px 0; ${F}">【已到貨現場對帳單】</div>`;
        let receiptTotal = 0;
        arrivedList.forEach(r => {
            const isPaid = PAID_STATUS.includes(r[1]);
            const sub = parseAmount(r[7]);
            if (!isPaid) receiptTotal += sub;
            imgContent += `
                <div class="img-item-row" style="${F}">
                    <div style="font-size:30px; font-weight:bold; line-height:1.3; color:#000000;">${escapeHtml(r[4] || "未知商品")}</div>
                    <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-top:8px;">
                        <div style="font-size:26px; color:#000000;">${escapeHtml(parseAmount(r[5]).toLocaleString())}元 x ${escapeHtml(r[6] || 0)}</div>
                        <div style="font-size:34px; font-weight:bold; color:#000000;">${isPaid ? '已付' : sub.toLocaleString() + '元'}</div>
                    </div>
                </div>`;
        });
        if (arrivedList.length === 0) imgContent += `<div style="font-size:26px; padding:20px 0; border-bottom:4px solid #000000; ${F}">目前沒有已到貨商品</div>`;
        imgContent += `
            <div style="margin-top:25px; padding-top:15px; font-size:36px; font-weight:bold; text-align:right; ${F} color:#000000;">應付總金額：${receiptTotal.toLocaleString()} 元</div>
            <div id="receiptTime" style="text-align:right; margin-top:12px; font-size:22px; color:#000000; ${F}"></div>
            <div style="text-align:center; margin-top:35px; font-size:22px; color:#555; ${F}">謝謝惠顧，歡迎再次光臨！</div>`;
        document.getElementById('captureArea').innerHTML = imgContent;

        html += `<button type="button" class="print-btn" onclick="generateImage()">🖼️ 生成大字明細圖片 (現場取貨對帳用)</button>`;

        html += `
            <div class="summary-box">
                <div class="summary-row">
                    <div class="sum-label">已到貨合計<br><small>${aStats.items} 品項 / ${aStats.qty} 件商品</small></div>
                    <div class="sum-val highlight-gold">$${aStats.total.toLocaleString()}</div>
                </div>
                <div class="summary-row">
                    <div class="sum-label">未到貨合計<br><small>${nStats.items} 品項 / ${nStats.qty} 件商品</small></div>
                    <div class="sum-val">$${nStats.total.toLocaleString()}</div>
                </div>
                <div class="summary-row" style="border:none; margin-top:10px; padding-top:20px;">
                    <div class="sum-label" style="color:white; font-size:1.1em; font-weight:bold;">總金額</div>
                    <div class="sum-val normal-white">$${(aStats.total + nStats.total).toLocaleString()}</div>
                </div>
            </div>`;

        document.getElementById('resultArea').innerHTML = html;
    }

    function createCard(row, type) {
        const status = row[1];
        const isPaid = PAID_STATUS.includes(status);
        return `
            <div class="card ${type === 'arrived' ? 'arrived-card' : 'not-arrived-card'}">
                <div class="status-tag ${type === 'arrived' ? 'tag-green' : 'tag-gray'}">${status}</div>
                <div class="item-header">
                    <span>${row[4] || "未知商品"}</span>
                    <span class="${isPaid ? 'paid-text' : 'price-text'}">${isPaid ? '已結清' : '$' + parseAmount(row[7]).toLocaleString()}</span>
                </div>
                <div class="item-info">單價: $${row[5] || 0} | 數量: ${row[6] || 0}</div>
                ${row[8] ? `<div class="note-text">📝 備註: ${row[8]}</div>` : ''}
            </div>`;
    }

    async function generateImage() {
        const area = document.getElementById('captureArea');
        const output = document.getElementById('imageOutput');
        const container = document.getElementById('imageContainer');
        container.innerHTML = "<div style='padding:20px; font-weight:bold; color:#555;'>⏳ 大字明細製圖中，請稍候...</div>";
        output.style.display = 'block';
        output.scrollIntoView({ behavior: 'smooth' });
        try {
            const timeEl = document.getElementById('receiptTime');
            if (timeEl) timeEl.textContent = `產生時間：${nowTaipeiText()}`;
            // 等 Noto Sans TC 載入完成再截圖（最多等 8 秒，逾時就用備用字型）
            if (document.fonts) {
                const text = area.textContent || '';
                await Promise.race([
                    Promise.all([
                        document.fonts.load(`400 26px "Noto Sans TC"`, text),
                        document.fonts.load(`700 30px "Noto Sans TC"`, text)
                    ]).then(() => document.fonts.ready),
                    new Promise(r => setTimeout(r, 8000))
                ]).catch(() => {});
            }
            const canvas = await html2canvas(area, { backgroundColor: "#ffffff", scale: 2, logging: false, useCORS: true });
            container.innerHTML = `<img src="${canvas.toDataURL("image/png")}" alt="北冰洋水產已到貨明細">`;
            output.scrollIntoView({ behavior: 'smooth' });
        } catch (e) {
            console.error(e);
            container.innerHTML = "<div style='color:red; padding:10px;'>圖片產生失敗，請再試一次。</div>";
        }
    }

    window.onload = initDataLoader;
</script>
</body>
</html>
